# Profiles
#   dev (default)  docker compose -f deploy/docker-compose.yml up
#                  one container: API + UI + pipeline, SQLite
#   standard       TDN_CLICKHOUSE=http://clickhouse:8123 \
#                  docker compose -f deploy/docker-compose.yml --profile standard up
#                  spans in ClickHouse, metadata in SQLite
#   scale          TDN_CLICKHOUSE=http://clickhouse:8123 TDN_KAFKA_BOOTSTRAP=redpanda:9092 \
#                  docker compose -f deploy/docker-compose.yml --profile scale up --scale tracedown-worker=3
#                  API publishes to Redpanda; workers run the pipeline; spans in ClickHouse
#
# Metadata (runs, findings, incidents, users) is SQLite in every profile today. With
# several workers it is the bottleneck; the Postgres store (DDL in sql/postgres.sql) is the
# next storage milestone. Run one API replica until then.
x-tdn: &tdn
  build: { context: .., dockerfile: deploy/Dockerfile }
  volumes: ["tdn-data:/data"]
  environment: &tdn-env
    TDN_API_KEYS: ${TDN_API_KEYS:-}            # comma-separated bootstrap keys; empty = open (dev only)
    TDN_SESSION_SECRET: ${TDN_SESSION_SECRET:-change-me}
    TDN_PUBLIC_URL: ${TDN_PUBLIC_URL:-http://localhost:7070}
    TDN_OIDC_ISSUER: ${TDN_OIDC_ISSUER:-}       # SSO: set issuer, client id/secret, redirect URI, role map
    TDN_OIDC_CLIENT_ID: ${TDN_OIDC_CLIENT_ID:-}
    TDN_OIDC_CLIENT_SECRET: ${TDN_OIDC_CLIENT_SECRET:-}
    TDN_OIDC_REDIRECT_URI: ${TDN_OIDC_REDIRECT_URI:-}
    TDN_OIDC_ROLE_MAP: ${TDN_OIDC_ROLE_MAP:-{}}
    TDN_OTLP_FORWARD: ${TDN_OTLP_FORWARD:-}      # e.g. http://otel-collector:4318/v1/traces
    TDN_CLICKHOUSE: ${TDN_CLICKHOUSE:-}          # standard/scale: http://clickhouse:8123
    TDN_KAFKA_BOOTSTRAP: ${TDN_KAFKA_BOOTSTRAP:-}  # scale: redpanda:9092

services:
  tdn:
    <<: *tdn
    ports: ["7070:7070"]

  tracedown-worker:
    <<: *tdn
    profiles: ["scale"]
    command: ["tracedown-worker"]
    depends_on: [redpanda, clickhouse]

  clickhouse:
    profiles: ["standard", "scale"]
    image: clickhouse/clickhouse-server:24.8
    environment: { CLICKHOUSE_SKIP_USER_SETUP: "1" }
    ports: ["8123:8123"]
    volumes: ["ch-data:/var/lib/clickhouse"]

  redpanda:
    profiles: ["scale"]
    image: redpandadata/redpanda:v24.2.7
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "1G",
              "--kafka-addr", "PLAINTEXT://0.0.0.0:9092", "--advertise-kafka-addr", "PLAINTEXT://redpanda:9092"]
    ports: ["9092:9092"]

  postgres:                                    # schema only, for the upcoming Postgres metadata store
    profiles: ["postgres"]
    image: postgres:16.4
    environment: { POSTGRES_USER: tdn, POSTGRES_PASSWORD: tdn, POSTGRES_DB: tdn }
    volumes: ["./sql/postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro", "pg-data:/var/lib/postgresql/data"]
    ports: ["5432:5432"]

volumes:
  tdn-data:
  ch-data:
  pg-data:
