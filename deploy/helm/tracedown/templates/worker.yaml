{{- if include "tdn.kafkaEnabled" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tdn.fullname" . }}-worker
  labels: {{- include "tdn.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "tdn.selector" (list . "worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "tdn.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- include "tdn.podCommon" . | nindent 6 }}
      terminationGracePeriodSeconds: 60   # finish the current batch, then leave the consumer group
      containers:
        - name: worker
          image: {{ include "tdn.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["tracedown-worker"]
          ports: [{ name: health, containerPort: {{ .Values.worker.healthPort }} }]
          envFrom: {{- include "tdn.envFrom" . | nindent 12 }}
          {{- with .Values.worker.extraEnv }}
          env: {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 4
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
{{- end }}
