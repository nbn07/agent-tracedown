{{- if not .Values.secrets.existingSecret }}
{{- $fn := include "tdn.fullname" . }}
{{- $name := printf "%s-env" $fn }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "tdn.labels" . | nindent 4 }}
type: Opaque
stringData:
  TDN_SESSION_SECRET: {{ .Values.secrets.sessionSecret | default (include "tdn.stableRandom" (list . $name "TDN_SESSION_SECRET" 48)) | quote }}
  {{- with .Values.secrets.apiKeys }}
  TDN_API_KEYS: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.oidc }}
  {{- if .issuer }}
  TDN_OIDC_ISSUER: {{ .issuer | quote }}
  TDN_OIDC_CLIENT_ID: {{ .clientId | quote }}
  TDN_OIDC_CLIENT_SECRET: {{ .clientSecret | quote }}
  TDN_OIDC_REDIRECT_URI: {{ .redirectUri | quote }}
  {{- with .roleMap }}
  TDN_OIDC_ROLE_MAP: {{ . | quote }}
  {{- end }}
  {{- with .allowedDomains }}
  TDN_OIDC_ALLOWED_DOMAINS: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  TDN_DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.username (include "tdn.pgPassword" .) $fn .Values.postgresql.database | quote }}
  {{- else if .Values.external.databaseUrl }}
  TDN_DATABASE_URL: {{ .Values.external.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  TDN_REDIS_URL: {{ printf "redis://%s-redis:6379/0" $fn | quote }}
  {{- else if .Values.external.redisUrl }}
  TDN_REDIS_URL: {{ .Values.external.redisUrl | quote }}
  {{- end }}
  {{- if .Values.redpanda.enabled }}
  TDN_KAFKA_BOOTSTRAP: {{ printf "%s-redpanda:9092" $fn | quote }}
  {{- else if .Values.external.kafkaBootstrap }}
  TDN_KAFKA_BOOTSTRAP: {{ .Values.external.kafkaBootstrap | quote }}
  {{- end }}
  {{- if .Values.clickhouse.enabled }}
  TDN_CLICKHOUSE: {{ printf "{\"clusters\": {\"default\": {\"url\": \"http://%s-clickhouse:8123\", \"ttl_days\": %d}}}" $fn (int .Values.clickhouse.ttlDays) | quote }}
  {{- else if .Values.external.clickhouse }}
  TDN_CLICKHOUSE: {{ .Values.external.clickhouse | quote }}
  {{- end }}
  {{- with .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
