{{- if .Values.ingress.enabled }}
{{- $fn := include "tdn.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fn }}
  labels: {{- include "tdn.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range list "/api" "/v1" "/auth" "/healthz" "/metrics" "/docs" "/openapi.json" }}
          - path: {{ . }}
            pathType: Prefix
            backend: { service: { name: {{ $fn }}-server, port: { name: http } } }
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fn }}-{{ ternary "web" "server" .Values.web.enabled }}
                port: { name: http }
{{- end }}
