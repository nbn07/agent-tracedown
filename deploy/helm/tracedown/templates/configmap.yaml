apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tdn.fullname" . }}-config
  labels: {{- include "tdn.labels" . | nindent 4 }}
data:
  TDN_HOST: "0.0.0.0"
  TDN_PORT: {{ .Values.server.port | quote }}
  TDN_DB: /tmp/tracedown.db               # only used when no Postgres is configured
  {{- $public := .Values.config.publicUrl | default (ternary (printf "https://%s" .Values.ingress.host) "" .Values.ingress.enabled) }}
  TDN_PUBLIC_URL: {{ $public | quote }}
  TDN_DRIFT_MIN_RUNS: {{ .Values.config.driftMinRuns | quote }}
  {{- if .Values.config.authRequired }}
  TDN_AUTH: required
  {{- end }}
  {{- with .Values.config.judge }}
  TDN_JUDGE: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.otlpForward }}
  TDN_OTLP_FORWARD: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.prices }}
  TDN_PRICES: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.clickhouseCluster }}
  TDN_CLICKHOUSE_CLUSTER: {{ . | quote }}
  {{- end }}
  TDN_KAFKA_GROUP: {{ .Values.worker.group | quote }}
  TDN_WORKER_HEALTH_PORT: {{ .Values.worker.healthPort | quote }}
  {{- range $k, $v := .Values.config.extra }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
