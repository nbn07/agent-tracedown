[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tracedown"
version = "0.4.2"
description = "The flight recorder for AI agents: find the step that caused a failure, then replay the run with a fix."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []  # stdlib only, by design
authors = [{ name = "Naveen Nair" }]
keywords = ["ai-agents", "llm", "observability", "debugging", "root-cause-analysis", "opentelemetry", "tracing", "langfuse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]


[project.urls]
Homepage = "https://github.com/nbn07/agent-tracedown"
Source = "https://github.com/nbn07/agent-tracedown"
Issues = "https://github.com/nbn07/agent-tracedown/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]
# Framework adapters import their framework lazily; these extras just pin tested versions.
langgraph = ["langgraph>=1.0", "langchain-core>=1.0"]
openai-agents = ["openai-agents>=0.2"]
crewai = ["crewai>=1.0"]
autogen = ["autogen-agentchat>=0.4"]
semantic-kernel = ["semantic-kernel>=1.30"]
llamaindex = ["llama-index-core>=0.12"]
claude-agent-sdk = ["claude-agent-sdk>=0.2"]
google-adk = ["google-adk>=2.0"]
pydantic-ai = ["pydantic-ai-slim>=2.0"]
mcp = ["mcp>=1.30"]

[tool.setuptools.packages.find]
include = ["agent_tracedown*"]
