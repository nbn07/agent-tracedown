[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tracedown-server"
version = "0.5.0"
description = "Tracedown server and CLI: root-cause analysis for AI agent runs, importers for Langfuse and OpenTelemetry, replay planning and a web viewer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["agent-tracedown>=0.5.0,<0.6", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]
authors = [{ name = "Naveen Nair" }]
keywords = ["ai-agents", "llm", "observability", "debugging", "root-cause-analysis", "opentelemetry", "tracing", "langfuse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]



[project.urls]
Homepage = "https://github.com/nbn07/agent-tracedown"
Source = "https://github.com/nbn07/agent-tracedown"
Issues = "https://github.com/nbn07/agent-tracedown/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27", "chdb>=2", "pyjwt[crypto]>=2.8", "psycopg[binary]>=3.1", "psycopg-pool>=3.2",
       "redis>=5", "mcp>=1.30,<2"]
sso = ["pyjwt[crypto]>=2.8"]
postgres = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]   # TDN_DATABASE_URL
redis = ["redis>=5"]                                       # TDN_REDIS_URL
mcp = ["mcp>=1.30,<2"]                                     # tracedown mcp
clickhouse = []                      # HTTP client is stdlib; add chdb for embedded/local use
kafka = ["confluent-kafka>=2.3"]
enterprise = ["pyjwt[crypto]>=2.8", "confluent-kafka>=2.3", "psycopg[binary]>=3.1", "psycopg-pool>=3.2", "redis>=5"]

[project.scripts]
tracedown = "tracedown_server.cli:main"
tracedown-server = "tracedown_server.__main__:main"
tracedown-worker = "tracedown_server.enterprise.queue:main"
tracedown-import = "tracedown_server.importers.cli:main"

[tool.setuptools.packages.find]
include = ["tracedown_server*"]

[tool.setuptools.package-data]
tracedown_server = ["static/*", "web/**/*"]
