name: ci
on: [push, pull_request]

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ./sdk/python -e "./server[dev]"
      - run: pytest -q
      - name: RCA benchmark (holdout) must not regress
        run: |
          python benchmark/score.py --split holdout --json bench.json
          python -c "import json,sys; r=json.load(open('bench.json'))['agent-tracedown']; sys.exit(0 if r['exact@1'] >= 0.95 else 1)"

  web:
    # The web app, built both ways: the standalone server (Docker image) and the static
    # export that ships inside the Python package for `tracedown up`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm run build
        working-directory: web
      - run: node web/scripts/build-static.mjs
      - name: The server serves the bundled app
        run: |
          pip install -e ./sdk/python -e "./server[dev]"
          python - <<'PY'
          from fastapi.testclient import TestClient
          from tracedown_server.api import create_app, web_available
          from tracedown_server.storage import SQLiteStore
          assert web_available(), "static export missing"
          c = TestClient(create_app(SQLiteStore(":memory:")))
          for path in ("/", "/runs/", "/runs/some-id/", "/incidents/1/", "/analytics/"):
              r = c.get(path)
              assert r.status_code == 200 and "<html" in r.text, path
          print("web app served")
          PY

  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # the end-to-end tests compare TypeScript and Python runs on a real server
      - run: pip install -e ../python -e ../../server
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Vercel AI SDK v6 and v5
        run: |
          TDN_AI_PKG=ai-v6 node --import tsx --test test/ai-sdk.test.ts
          TDN_AI_PKG=ai-v5 node --import tsx --test test/ai-sdk.test.ts

  frameworks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [langgraph, openai-agents, crewai, autogen, semantic-kernel, llamaindex, claude-agent-sdk, google-adk, pydantic-ai, mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest -e "./sdk/python[${{ matrix.extra }}]"
      - run: PYTHONPATH=sdk/python pytest -q sdk/python/tests/integrations
      - name: MCP 1.x too (most projects still use it)
        if: matrix.extra == 'mcp'
        run: pip install "mcp>=1.30,<2" && PYTHONPATH=sdk/python pytest -q sdk/python/tests/integrations
