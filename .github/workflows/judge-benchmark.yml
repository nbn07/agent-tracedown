name: judge-benchmark

# Scores Tracedown with an LLM judge on the Who&When benchmark, on demand.
# Costs money: it calls the model once per log where the rules are unsure
# (about 70 to 140 calls). Run it from Actions → judge-benchmark → Run workflow.
#
# One-time setup: Settings → Secrets and variables → Actions → New repository secret,
# ANTHROPIC_API_KEY (for anthropic:...) and/or OPENAI_API_KEY (for openai:...).
# The key never appears in the logs or the results.
on:
  workflow_dispatch:
    inputs:
      judge:
        description: "Judge model, e.g. anthropic:claude-sonnet-5-5 or openai:gpt-5.4-mini"
        required: true
        default: anthropic:claude-sonnet-5-5

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ./sdk/python -e ./server
      - name: Get the Who&When logs
        run: |
          git clone --depth 1 https://github.com/mingyin1/Agents_Failure_Attribution ../Agents_Failure_Attribution
          python realworld/whowhen/convert.py --repo ../Agents_Failure_Attribution
      - name: Score with the judge
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JUDGE: ${{ inputs.judge }}
        run: |
          python realworld/whowhen/score.py --judge "$JUDGE" --workers 4 --json results.json | tee summary.txt
          slug=$(echo "$JUDGE" | tr ':/' '__')
          mkdir -p out && cp results.json summary.txt out/
          cp realworld/data/judge-cache-whowhen-$slug.jsonl out/judge-answers.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: whowhen-judge-results
          path: out/
