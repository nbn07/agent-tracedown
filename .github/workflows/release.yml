name: release

# Publishes agent-tracedown (SDK) and agent-tracedown-server to PyPI, and the TypeScript
# SDK agent-tracedown to npm, when a version tag such as v0.3.0 is pushed. Both registries
# use trusted publishing: they accept uploads only from this workflow in the named GitHub
# environment, and no token is stored anywhere.
# One-time setup is in RELEASING.md.
#
# Each PyPI package publishes from its own job and GitHub environment (pypi and
# pypi-server): PyPI allows only one pending trusted publisher per repository, workflow
# and environment, so the two new projects need different environments.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check the tag matches both package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$tag\"" sdk/python/pyproject.toml
          grep -q "^version = \"$tag\"" server/pyproject.toml
          grep -q "\"version\": \"$tag\"" sdk/typescript/package.json
          grep -q "SDK_VERSION = \"$tag\"" sdk/typescript/src/version.ts
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Build the web app into the server package (served by `tracedown up`)
        run: cd web && npm ci && node scripts/build-static.mjs
      - run: pip install build twine
      - run: python -m build sdk/python --outdir dist/sdk && python -m build server --outdir dist/server
      - run: twine check dist/sdk/* dist/server/*
      - name: The server wheel contains the web app
        run: python -m zipfile -l dist/server/*.whl | grep -q "tracedown_server/web/runs/_/index.html"
      - uses: actions/upload-artifact@v4
        with: { name: dist-sdk, path: dist/sdk/ }
      - uses: actions/upload-artifact@v4
        with: { name: dist-server, path: dist/server/ }

  publish-sdk:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi            # PyPI trusted publisher for agent-tracedown
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist-sdk, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-server:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-server     # PyPI trusted publisher for agent-tracedown-server
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist-server, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    runs-on: ubuntu-latest
    needs: build
    environment: npm
    permissions:
      contents: read
      id-token: write   # trusted publishing and provenance: npm checks this workflow's identity
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", registry-url: "https://registry.npmjs.org" }
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@11 && npm --version
      - run: npm ci && npm run build && npm test
      # no token: npm accepts this upload because the package's trusted publisher is
      # nbn07/agent-tracedown, workflow release.yml, environment npm
      - run: npm publish --provenance --access public
