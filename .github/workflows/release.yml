name: release

# Publishes agent-tracedown (SDK) and agent-tracedown-server to PyPI, and the TypeScript
# SDK agent-tracedown to npm, when a version tag such as v0.3.0 is pushed. PyPI uses
# trusted publishing (no token stored); npm uses the NPM_TOKEN secret if it is set.
# One-time setup is in RELEASING.md.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check the tag matches both package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$tag\"" sdk/python/pyproject.toml
          grep -q "^version = \"$tag\"" server/pyproject.toml
          grep -q "\"version\": \"$tag\"" sdk/typescript/package.json
          grep -q "SDK_VERSION = \"$tag\"" sdk/typescript/src/version.ts
      - run: pip install build twine
      - run: python -m build sdk/python --outdir dist && python -m build server --outdir dist
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    runs-on: ubuntu-latest
    needs: build
    environment: npm
    permissions:
      contents: read
      id-token: write   # npm provenance: the package page links back to this build
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - run: npm ci && npm run build && npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
