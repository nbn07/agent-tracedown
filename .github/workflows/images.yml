name: images

# Builds and publishes the container images the Helm chart uses:
#   ghcr.io/<owner>/agent-tracedown       (server + worker, deploy/Dockerfile)
#   ghcr.io/<owner>/agent-tracedown-web   (Next.js app, deploy/web.Dockerfile)
# on every v* tag (tagged with the version). Pushes to main and pull requests only build,
# so the Dockerfiles are checked without publishing anything.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["deploy/**", "server/**", "sdk/python/**", "web/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { name: agent-tracedown, dockerfile: deploy/Dockerfile }
          - { name: agent-tracedown-web, dockerfile: deploy/web.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
