name: tracedown-action
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tracedown-baseline.json
          key: tracedown-baseline-${{ github.ref }}
          restore-keys: tracedown-baseline-
      # The demo agents fail on purpose, so report without gating.
      - uses: ./
        with:
          command: python examples/run_demo.py --endpoint http://127.0.0.1:7070
          fail-on-regression: "false"
