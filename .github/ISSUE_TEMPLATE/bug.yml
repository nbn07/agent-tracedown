name: 🐛 Bug
description: Something is broken (a crash, an error, a page that doesn't load).
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. pip install ./sdk/python ./server
        2. tracedown-server --db demo.db
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: text
  - type: input
    id: env
    attributes:
      label: Versions
      placeholder: agent-tracedown 0.6.0, Python 3.12 / Node 22, macOS 15, SQLite or Postgres
